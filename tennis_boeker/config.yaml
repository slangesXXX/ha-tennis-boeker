name: Tennis Boeker
version: "1.3.1"
slug: tennis_boeker
url: https://github.com/slangesXXX/ha-tennis-boeker
description: Boekt automatisch een tennisbaan bij je KNLTB.Club-vereniging zodra die opengaat
arch:
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:tennis
panel_title: Tennisbaan
homeassistant_api: true
map:
  - share:ro
options:
  club_website: ""
  gebruiker: ""
  wachtwoord: ""
  login_met: Bondsnummer
  standaard_partner: ""
  reserve_partners: []
  extra_partners: []
  notify_service: ""
  agenda: ""
  voorkeursbaan: 0
  aantal_banen: 6
  dagen_vooruit: 3
  max_boekingen_per_dag: 2
  max_minuten_proberen: 5
schema:
  club_website: str
  gebruiker: str
  wachtwoord: password
  login_met: list(Bondsnummer|Clublidnummer)
  standaard_partner: str?
  reserve_partners:
    - str
  extra_partners:
    - str
  notify_service: str?
  agenda: str?
  voorkeursbaan: int(0,20)
  aantal_banen: int(1,20)
  dagen_vooruit: int(1,14)
  max_boekingen_per_dag: int(1,10)
  max_minuten_proberen: int(1,30)
